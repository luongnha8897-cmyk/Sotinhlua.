
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract source ZIP
        run: unzip -o SoTinhLua-Android-CloudBuild.zip -d .
      - name: Fix blank screen
        run: sed -i 's|<script crossorigin src="app.js"></script>|<script defer crossorigin src="app.js"></script>|' android_apk_project/app/src/main/assets/www/index.html
      - name: Build APK
        run: gradle -p android_apk_project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SoTinhLua-debug-apk
          path: android_apk_project/app/build/outputs/apk/debug/app-debug.apk
